  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --name:  #3f3b38;
      --sub:   #6d6a65;
      --title: #56524e;
      --desc:  #6f6b66;
      --live:  #e24b7c;
      --frame: #f4f2ec;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      /* Rothko-style warm field: warm gold → rose → dusty pink
         (best-effort — replace with exact Figma stops) */
      background: linear-gradient(
        180deg,
        #f1bd80 0%,
        #e9ac8b 22%,
        #dda0a1 45%,
        #d99ba1 58%,
        #e3b3b0 78%,
        #edcfc9 100%
      );
      background-attachment: fixed;
      color: var(--title);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
    }

    /* 8px framing stroke — spans the full document, scrolls with it */
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 8px solid var(--frame);
      pointer-events: none;
      z-index: 100;
    }

    .page {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 44px 32px calc(40px + env(safe-area-inset-bottom));
      text-align: left;
    }

    /* ---- Header ---- */
    .name {
      font-size: 32px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--name);
      text-align: center;
      line-height: 1.1;
    }

    .heart {
      display: block;
      width: 92px;
      height: auto;
      margin: 20px auto 18px;
      user-select: none;
    }

    .sub {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--sub);
      text-align: center;
    }

    /* ---- Projects ---- */
    .projects {
      margin-top: 72px;
      display: flex;
      flex-direction: column;
      gap: 56px;
    }

    .project-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .project-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
      color: var(--title);
      text-decoration: none;
    }
    .project-title:hover { text-decoration: underline; }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 18px;
      font-weight: 700;
      color: var(--live);
      text-decoration: none;
      white-space: nowrap;
    }
    .live:hover { text-decoration: underline; }
    .live svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
    }

    .project-desc {
      font-size: 18px;
      font-weight: 400;
      color: var(--desc);
      margin-top: 6px;
    }

    /* ---- Footer ---- */
    .footer {
      margin-top: auto;
      padding-top: 72px;
      text-align: center;
    }
    .footer a {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--sub);
      text-decoration: none;
    }
    .footer a:hover { text-decoration: underline; }
    .footer a + a { margin-left: 22px; }

    /* ---- Desktop: fully centered text ---- */
    @media (min-width: 640px) {
      .page { text-align: center; }
      .project-head { justify-content: center; }
    }

    /* ---- Mobile tightening ---- */
    @media (max-width: 480px) {
      .page { padding: 36px 22px calc(32px + env(safe-area-inset-bottom)); }
      .projects { margin-top: 56px; gap: 48px; }
    }
  </style>
</head>
<body>
  <main class="page">

    <header>
      <h1 class="name">mrinalini keskar</h1>
      <img class="heart" src="heart.png" alt="candy heart reading MRIN" />
      <p class="sub">product &amp; brand</p>
    </header>

    <section class="projects">

      <article class="project">
        <div class="project-head">
          <a class="project-title" href="decks/cfainparis-casestudy.pdf" target="_blank" rel="noopener">chicfilles</a>
          <a class="live" href="https://chickfilayeinparis.com" target="_blank" rel="noopener">
            Live
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
          </a>
        </div>
        <p class="project-desc">Your camera roll, geographically sliced</p>
      </article>

      <article class="project">
        <div class="project-head">
          <a class="project-title" href="decks/garde-robe.pdf" target="_blank" rel="noopener">Product Lead, Garde-Robe</a>
        </div>
        <p class="project-desc">Digital closet, selected works</p>
      </article>

      <article class="project">
        <div class="project-head">
          <a class="project-title" href="decks/emotional-roi.pdf" target="_blank" rel="noopener">emotional ROI</a>
        </div>
        <p class="project-desc">What users really want while shopping</p>
      </article>

    </section>

    <footer class="footer">
      <a href="https://www.instagram.com/mrinalinikeskar/" target="_blank" rel="noopener">instagram</a>
      <a href="https://www.linkedin.com/in/mrinalinikeskar/" target="_blank" rel="noopener">linkedin</a>
    </footer>

  </main>
</body>
</html>
