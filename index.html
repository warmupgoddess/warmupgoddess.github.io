<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mrinalini Keskar</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #e2e2e2;
      --text: #8a8a8a;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 100; /* Ultralight */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .page {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 32px 32px;
      position: relative;
      min-height: 100vh;
    }

    /* Name */
    .name {
      font-size: clamp(22px, 5vw, 52px);
      letter-spacing: 0.12em;
      color: var(--text);
      text-transform: uppercase;
      font-weight: 100;
      position: relative;
      z-index: 2;
    }

    /* Center area with rupee + heart */
    .center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Rupee image watermark */
    .rupee {
      position: absolute;
      width: clamp(200px, 38vw, 420px);
      height: auto;
      left: 50%;
      top: 50%;
      transform: translate(-60%, -50%);
      z-index: 1;
      pointer-events: none;
      user-select: none;
      opacity: 0.5;
    }

    /* Heart image */
    .heart {
      position: relative;
      z-index: 2;
      width: clamp(160px, 30vw, 320px);
      height: auto;
      display: block;
    }

    /* In Progress */
    .status {
      font-size: clamp(20px, 4.5vw, 48px);
      letter-spacing: 0.12em;
      color: var(--text);
      text-transform: uppercase;
      font-weight: 100;
      position: relative;
      z-index: 2;
    }

    /* ---- MOBILE ---- */
    @media (max-width: 480px) {
      .page {
        padding: 20px 20px 24px;
      }

      .rupee {
        width: 220px;
        transform: translate(-55%, -50%);
      }
    }
  </style>
</head>
<body>
  <div class="page">

    <h1 class="name">Mrinalini Keskar</h1>

    <div class="center">
      <img class="rupee" src="rupee.png" alt="" aria-hidden="true" />

      <img class="heart" src="heart.png" alt="candy heart" />
    </div>

    <p class="status">In Progress</p>

  </div>
</body>
</html>
