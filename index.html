  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Mobile metrics; the desktop block below scales them up by 10/9.
         The longest description — "Your camera roll, geographically sliced" —
         measures 18.875em in Helvetica Neue with the 0.04em tracking, so a
         block needs 18.875 x --text of inner width to seat it on one line.
         --text holds the design's 16.2px wherever that fits between the
         gutters, and eases down on phones too narrow to carry it. */
      --gutter:    23px;
      --pad-x:     16px;
      --text:      min(16.2px, calc((100vw - var(--gutter) * 2 - var(--pad-x) * 2) / 19.2));
      --gap-s:     7.2px;
      --pad-y:     30.6px;
      --deck-gap:  21.6px;
      --stack-w:   380px;
      --head-gap:  46.5px;
      --foot-size: 20px;

      --block:       rgba(255, 255, 255, 0.5);
      --block-hover: #fff;
      --ink:         #000;
      --live:        #a00060;
      --foot:        #fff;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      /* Rothko-esque field: rose → blush → coral */
      background-image: linear-gradient(
        180deg,
        rgb(251, 89, 102)  0%,
        rgb(244, 86, 99)   37.857%,
        rgb(255, 164, 172) 46.983%,
        rgb(255, 164, 172) 55.917%,
        rgb(254, 199, 179) 58.419%,
        rgb(255, 102, 58)  64.632%,
        rgb(255, 102, 58)  99.987%
      );
      background-attachment: fixed;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* Blurred wash sitting over the gradient, under everything else */
    .veil {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.1);
      -webkit-backdrop-filter: blur(40px);
      backdrop-filter: blur(40px);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px var(--gutter) calc(24px + env(safe-area-inset-bottom));
    }

    /* ---- Masthead: name · heart · discipline ---- */
    .masthead {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      font-size: 30px;
      font-weight: 300;
      line-height: normal;
      letter-spacing: 0.07em;
      color: #fff;
      text-align: center;
    }

    .masthead span { white-space: nowrap; }

    /* Sized off the masthead type: 53.5px against 30px on mobile */
    .heart {
      display: block;
      width: 1.7833em;
      height: 1.7833em;
      object-fit: contain;
      user-select: none;
    }

    /* ---- Deck blocks ---- */
    .decks {
      margin-top: var(--head-gap);
      width: 100%;
      max-width: var(--stack-w);
      display: flex;
      flex-direction: column;
      gap: var(--deck-gap);
    }

    .deck {
      position: relative;
      background: var(--block);
      overflow: clip;
      padding: var(--pad-y) var(--pad-x);
      display: flex;
      flex-direction: column;
      gap: var(--gap-s);
      text-align: center;
      font-size: var(--text);
      line-height: normal;
      letter-spacing: 0.04em;
      word-break: break-word;
      transition: background-color 0.15s ease;
    }

    .deck-head { font-weight: 700; }

    /* The title link stretches over the whole block */
    .deck-link {
      color: var(--ink);
      text-decoration: underline;
      text-underline-position: from-font;
    }
    .deck-link::after {
      content: "";
      position: absolute;
      inset: 0;
    }
    .deck-link:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }

    .deck-head .light { font-weight: 300; }

    /* Sits above the stretched link so it stays separately clickable */
    .live {
      position: relative;
      z-index: 1;
      margin-left: var(--gap-s);
      color: var(--live);
      text-decoration: none;
      white-space: nowrap;
    }
    .live:hover { text-decoration: underline; }

    .deck-desc { font-weight: 400; }

    /* Touch: every block reads the same, and lights up on press */
    @media (hover: none) {
      .deck:active { background: var(--block-hover); }
    }

    /* Pointer: the whole block lights up on hover */
    @media (hover: hover) {
      .deck:hover { background: var(--block-hover); }
    }

    /* ---- Footer ---- */
    .footer {
      margin-top: auto;
      padding-top: 48px;
      width: 100%;
      text-align: center;
    }
    .footer a {
      font-size: var(--foot-size);
      font-weight: 700;
      line-height: normal;
      letter-spacing: 0.07em;
      color: var(--foot);
      opacity: 0.5;
      text-decoration: none;
      white-space: nowrap;
    }
    .footer a:hover { opacity: 0.75; }

    /* ---- Narrow phones: trim the gutter so long lines still fit ---- */
    @media (max-width: 392px) {
      :root { --gutter: 16px; }
    }

    /* ---- Desktop ---- */
    @media (min-width: 640px) {
      :root {
        --gutter:    33px;
        --text:      18px;
        --gap-s:     8px;
        --pad-y:     34px;
        --pad-x:     28px;
        --deck-gap:  24px;
        /* 420 - 2x28 = 364px of inner width, against the 340px the longest
           description needs at 18px — one line with room to spare */
        --stack-w:   420px;
        --head-gap:  38px;
        --foot-size: 40px;
      }

      .page { padding: 56px var(--gutter) calc(24px + env(safe-area-inset-bottom)); }

      /* Name, heart and discipline on one line. The row measures 16.98em wide,
         so 60px holds from the 1280 design width down to ~1116px, below which
         the type — and the heart with it — eases down rather than wrapping. */
      .masthead {
        flex-direction: row;
        gap: 0.5em;
        font-size: min(60px, calc((100vw - var(--gutter) * 2) / 17.5));
      }

      /* 39.322px against 60px type */
      .heart {
        width: 0.6554em;
        height: 0.6554em;
      }

      .footer { text-align: left; }
    }
  </style>
</head>
<body>

        </p>

      </article>

    </section>

    <footer class="footer">
      <a href="https://www.linkedin.com/in/mrinalinikeskar/" target="_blank" rel="noopener">linkedin</a>
    </footer>

  </main>
